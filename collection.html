<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Record Card</title>
    <!-- Tailwind CSS CDN for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .perspective-1000 {
            perspective: 1000px;
        }
        .transform-style-3d {
            transform-style: preserve-3d;
        }
        .backface-hidden {
            backface-visibility: hidden;
        }
        .rotate-y-180 {
            transform: rotateY(180deg);
        }

        .decay-target {
            transition: filter 15s ease-out, opacity 15s ease-out, letter-spacing 15s ease-out;
            filter: blur(0px);
            opacity: 1;
            letter-spacing: normal;
        }

        /* Specific decay for standard fields (15s total) */
        .decay-active .decay-target:not(.decay-delayed) {
            filter: blur(5px);
            opacity: 0.2;
            letter-spacing: 0.25em;
        }

        /* Delayed decay for "What was not captured" (stays sharp for ~13s, decays in the final 2s) */
        .decay-active .decay-delayed {
            transition: filter 2s ease-in 13s, opacity 2s ease-in 13s, letter-spacing 2s ease-in 13s;
            filter: blur(5px);
            opacity: 0.2;
            letter-spacing: 0.25em;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-amber-50 via-orange-50/50 to-sky-50 min-h-screen m-0 p-6 flex flex-col items-center">

    <header class="w-full max-w-6xl mb-10 text-center">
        <h1 class="text-3xl font-light text-slate-700 tracking-wide">Electrical Lifeforms & Energy Specimens</h1>
        <p class="text-sm font-light text-slate-400 mt-2 tracking-wider">Documenting mortal batteries, charging pulses, and current states of charge</p>
    </header>

    <main id="cardsGrid" class="w-full max-w-6xl grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 justify-items-center pb-12">
        <!-- Dynamically injected cards will appear here -->
    </main>

    <script>
        const loadRecordData = () => {
            const populateData = (data) => {
                const grid = document.getElementById('cardsGrid');
                grid.innerHTML = ''; 

                if (data.records && Array.isArray(data.records)) {
                    data.records.forEach((record, index) => {
                        const cardId = `cardInner-${index}`;
                        const fieldsId = `specimenFields-${index}`;
                        const mediaContainerId = `frontMediaContainer-${index}`;

                        let mediaContentHtml = '';
                        
                        if (record.type === 'image') {
                            mediaContentHtml = `
                                <div id="${mediaContainerId}" class="w-full h-60 bg-amber-950/5 rounded-2xl border border-amber-200/60 flex flex-col items-center justify-center relative overflow-hidden backdrop-blur-[2px] p-2">
                                    <div class="absolute -right-8 -top-8 w-24 h-24 bg-yellow-200/30 rounded-full blur-xl"></div>
                                    <svg class="w-8 h-8 mb-2 stroke-1.5 text-amber-500 placeholder-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                                    </svg>
                                    <span class="text-xs font-semibold tracking-wide text-amber-800/80 placeholder-text">Image Specimen</span>
                                </div>
                            `;
                        } else if (record.type === 'sound' || record.type === 'audio') {
                            mediaContentHtml = `
                                <div id="${mediaContainerId}" class="w-full h-60 bg-amber-50/50 rounded-2xl border border-amber-200/60 flex flex-col items-center justify-center p-4 relative overflow-hidden shadow-inner">
                                    <div class="w-12 h-12 rounded-full bg-amber-100 flex items-center justify-center text-amber-600 mb-3 shadow-sm">
                                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2Z" /></svg>
                                    </div>
                                    <audio controls class="w-full rounded-lg">
                                        <source src="${record.file || ''}" type="audio/mpeg">
                                        Your browser does not support audio playback.
                                    </audio>
                                </div>
                            `;
                        } else if (record.type === 'video' || record.type === 'mp4') {
                            mediaContentHtml = `
                                <div id="${mediaContainerId}" class="w-full h-60 bg-black/90 rounded-2xl flex flex-col items-center justify-center relative overflow-hidden shadow-inner border border-stone-800">
                                    <video controls class="w-full h-full object-contain rounded-2xl">
                                        <source src="${record.file || ''}" type="video/mp4">
                                        Your browser does not support video playback.
                                    </video>
                                </div>
                            `;
                        } else if (record.type === 'text') {
                            mediaContentHtml = `
                                <div id="${mediaContainerId}" class="w-full h-60 bg-stone-50/80 border border-stone-200 rounded-2xl p-4 flex flex-col relative overflow-hidden font-mono text-[11px] text-stone-700 shadow-inner">
                                    <div class="text-[10px] text-stone-400 uppercase tracking-widest mb-1 font-sans font-semibold">Transcript / Note:</div>
                                    <div id="textContent-${index}" class="overflow-y-auto max-h-44 w-full pr-1 text-stone-700 leading-relaxed whitespace-pre-wrap">
                                        Loading text file...
                                    </div>
                                </div>
                            `;
                        } else {
                            mediaContentHtml = `
                                <div class="w-full h-60 bg-gradient-to-tr from-amber-100/60 to-emerald-100/60 rounded-2xl border-2 border-dashed border-amber-300/80 flex flex-col items-center justify-center text-amber-800/60 relative">
                                    <span class="text-xs font-semibold">General Record</span>
                                </div>
                            `;
                        }

                        const cardHtml = `
                            <div class="w-full max-w-[360px] md:max-w-[380px] h-[540px] perspective-1000">
                                <div id="${cardId}" class="relative w-full h-full duration-700 transform-style-3d shadow-xl rounded-3xl transition-transform">
                                    
                                    <!-- Front Face -->
                                    <div class="absolute inset-0 w-full h-full bg-gradient-to-b from-white to-amber-50/30 text-slate-800 rounded-3xl border border-amber-200/60 p-6 flex flex-col justify-between box-border backface-hidden shadow-sm">
                                        
                                        <!-- Top: Larger Media Container -->
                                        <div class="w-full">
                                            ${mediaContentHtml}
                                        </div>

                                        <!-- Bottom: Title & Location right above the Archive Button -->
                                        <div class="flex flex-col gap-3">
                                            <div>
                                                <h2 class="text-lg font-bold text-slate-800 tracking-tight mb-0.5 flex items-center justify-between">
                                                    <span class="truncate">${record.title || 'Untitled'}</span>
                                                    <span class="inline-block animate-bounce text-sm">⚡</span>
                                                </h2>
                                                <p class="text-xs text-slate-500 font-normal truncate">
                                                    ${record.place || 'Unknown location'}
                                                </p>
                                            </div>

                                            <div>
                                                <button onclick="flipCard('${cardId}', '${fieldsId}', true)" class="w-full py-3 px-4 bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-600 hover:to-orange-600 text-white font-semibold rounded-2xl transition-all duration-200 shadow-md shadow-amber-500/20 focus:outline-none focus:ring-2 focus:ring-amber-400 focus:ring-offset-2 tracking-wide text-xs">
                                                    Archive this 🔋
                                                </button>
                                            </div>
                                        </div>
                                    </div>

                                    <!-- Back Face -->
                                    <div class="absolute inset-0 w-full h-full bg-[#fdfcf7] text-[#4a453d] rounded-3xl border border-[#e3ded2] p-6 flex flex-col justify-between box-border backface-hidden rotate-y-180 font-mono shadow-sm">
                                        
                                        <div>
                                            <div class="flex justify-between items-center border-b border-[#e3ded2] pb-3 mb-3">
                                                <span class="text-xs uppercase tracking-widest text-[#8c8273]">Energy Specimen</span>
                                                <span class="text-xs font-semibold text-[#5c5448]">CAT. NO. ${record.id || record.catalog_id || '#...'}</span>
                                            </div>
                                        </div>

                                        <div id="${fieldsId}" class="flex flex-col justify-start gap-3 flex-grow py-1 text-xs overflow-y-auto pr-1">
                                            <div>
                                                <span class="text-[#9e9485] block uppercase tracking-wider text-[10px] mb-0.5">Title</span>
                                                <span class="text-[#332f28] font-medium decay-target inline-block">${record.title || ''}</span>
                                            </div>
                                            <div>
                                                <span class="text-[#9e9485] block uppercase tracking-wider text-[10px] mb-0.5">Date and place</span>
                                                <span class="text-[#332f28] decay-target inline-block">${record.date || ''} / ${record.place || ''}</span>
                                            </div>
                                            <div>
                                                <span class="text-[#9e9485] block uppercase tracking-wider text-[10px] mb-0.5">Recorded by</span>
                                                <span class="text-[#332f28] decay-target inline-block">${record.recorder || ''}</span>
                                            </div>
                                            <div>
                                                <span class="text-[#9e9485] block uppercase tracking-wider text-[10px] mb-0.5">What was not captured</span>
                                                <span class="text-[#5c5448] leading-relaxed block text-[11px] decay-target decay-delayed whitespace-pre-wrap">${record.not_captured || ''}</span>
                                            </div>
                                        </div>

                                        <div class="pt-2">
                                            <button onclick="flipCard('${cardId}', '${fieldsId}', false)" class="w-full py-2.5 px-4 bg-[#e8e4db] hover:bg-[#ded9cc] text-[#4a453d] font-medium rounded-xl transition-all duration-200 border border-[#d8d1c2] text-xs uppercase tracking-wider focus:outline-none">
                                                Flip back
                                            </button>
                                        </div>
                                    </div>

                                </div>
                            </div>
                        `;

                        grid.insertAdjacentHTML('beforeend', cardHtml);

                        if (record.type === 'image' && record.file) {
                            const container = document.getElementById(mediaContainerId);
                            if (container) {
                                container.innerHTML = `
                                    <img src="${record.file}" alt="${record.title || 'Specimen'}" class="w-full h-full object-contain rounded-xl">
                                `;
                            }
                        }

                        if (record.type === 'text' && record.file) {
                            const textContainer = document.getElementById(`textContent-${index}`);
                            if (textContainer) {
                                fetch(record.file)
                                    .then(res => {
                                        if (!res.ok) throw new Error('Failed to load text file');
                                        return res.text();
                                    })
                                    .then(textData => {
                                        textContainer.textContent = textData;
                                    })
                                    .catch(err => {
                                        textContainer.textContent = record.not_captured || 'Could not load text file.';
                                    });
                            }
                        }
                    });
                }
            };

            const fallbackData = {
                "records": [
                    {
                        "id": "EL-001",
                        "title": "Stray Capacitance Echo",
                        "type": "image",
                        "file": "https://placehold.co/400x300/f59e0b/ffffff?text=Specimen+Alpha",
                        "date": "2026-03-12",
                        "place": "Sector 7 Substation",
                        "recorder": "Dr. V. Vance",
                        "not_captured": "A faint hum of residual electromagnetic consciousness lingering long after the power grid was completely powered down."
                    },
                    {
                        "id": "EL-002",
                        "title": "Resonant Audio Pulse",
                        "type": "sound",
                        "file": "",
                        "date": "2026-04-01",
                        "place": "Abandoned Transformer Vault",
                        "recorder": "Tech. K. Rix",
                        "not_captured": "Harmonic frequencies shifting upward beyond human hearing threshold whenever anyone approached the terminals."
                    }
                ]
            };

            const targetUrl = (window.location.protocol.startsWith('blob') ? 'records.json' : './records.json') + '?t=' + new Date().getTime();
            fetch(targetUrl)
                .then(response => {
                    if (!response.ok) throw new Error('Network response was not ok');
                    return response.json();
                })
                .then(data => populateData(data))
                .catch(err => {
                    // Fall back to sample data gracefully instead of showing server error warning
                    populateData(fallbackData);
                });
        };

        window.addEventListener('DOMContentLoaded', () => {
            loadRecordData();
        });

        function flipCard(cardId, fieldsId, showBack) {
            const cardInner = document.getElementById(cardId);
            const specimenFields = document.getElementById(fieldsId);
            
            if (showBack) {
                cardInner.classList.add('rotate-y-180');
                setTimeout(() => {
                    specimenFields.classList.add('decay-active');
                }, 100);
            } else {
                cardInner.classList.remove('rotate-y-180');
                specimenFields.classList.remove('decay-active');
            }
        }
    </script>
</body>
</html>
