<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electrical Lifeforms & Energy Specimens</title>
    <!-- Tailwind CSS CDN for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .perspective-1000 {
            perspective: 1000px;
        }
        .transform-style-3d {
            transform-style: preserve-3d;
        }
        .backface-hidden {
            backface-visibility: hidden;
        }
        .rotate-y-180 {
            transform: rotateY(180deg);
        }

        .decay-target {
            transition: filter 15s ease-out, opacity 15s ease-out, letter-spacing 15s ease-out;
            filter: blur(0px);
            opacity: 1;
            letter-spacing: normal;
        }

        /* Specific decay for standard fields (15s total) */
        .decay-active .decay-target:not(.decay-delayed) {
            filter: blur(5px);
            opacity: 0.2;
            letter-spacing: 0.25em;
        }

        /* Delayed decay for "What was not captured" (stays sharp for ~13s, decays in the final 2s) */
        .decay-active .decay-delayed {
            transition: filter 2s ease-in 13s, opacity 2s ease-in 13s, letter-spacing 2s ease-in 13s;
            filter: blur(5px);
            opacity: 0.2;
            letter-spacing: 0.25em;
        }

        /* Cyberpunk Grid Background Effect */
        .bg-cyber-grid {
            background-image: 
                linear-gradient(to right, rgba(16, 185, 129, 0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(16, 185, 129, 0.05) 1px, transparent 1px);
            background-size: 32px 32px;
        }

        /* Glow effects */
        .neon-glow {
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.15), inset 0 0 15px rgba(16, 185, 129, 0.05);
        }
        .neon-glow-hover:hover {
            box-shadow: 0 0 25px rgba(16, 185, 129, 0.35);
        }
        .text-glow {
            text-shadow: 0 0 10px rgba(16, 185, 129, 0.6);
        }

        /* Custom Audio Wave Animation */
        @keyframes electricPulse {
            0%, 100% { height: 12px; opacity: 0.4; }
            50% { height: 48px; opacity: 1; filter: drop-shadow(0 0 8px rgba(16, 185, 129, 0.8)); }
        }
        .wave-bar {
            animation: electricPulse 1.2s ease-in-out infinite;
        }
        .wave-bar:nth-child(2) { animation-delay: 0.2s; }
        .wave-bar:nth-child(3) { animation-delay: 0.4s; }
        .wave-bar:nth-child(4) { animation-delay: 0.1s; }
        .wave-bar:nth-child(5) { animation-delay: 0.5s; }
        .wave-bar:nth-child(6) { animation-delay: 0.3s; }
        .wave-bar:nth-child(7) { animation-delay: 0.6s; }
    </style>
</head>
<body class="bg-[#050806] bg-cyber-grid text-emerald-400 min-h-screen m-0 p-6 flex flex-col items-center selection:bg-emerald-500 selection:text-black">

    <header class="w-full max-w-6xl mb-12 text-center relative">
        <div class="absolute inset-0 -top-6 bg-emerald-500/5 blur-3xl rounded-full max-w-md mx-auto pointer-events-none"></div>
        <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-emerald-950/60 border border-emerald-500/30 text-emerald-400 text-xs font-mono mb-4 tracking-widest uppercase">
            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
            Grid Active // Live Archival Unit
        </div>
        <h1 class="text-4xl md:text-5xl font-black text-white tracking-wider font-mono">
            ELECTRICAL <span class="text-emerald-400 text-glow">LIFEFORMS</span>
        </h1>
        <p class="text-sm font-mono text-emerald-600/80 mt-3 tracking-widest uppercase">
            Documenting mortal batteries, high-voltage pulses, and current states of charge
        </p>

        <!-- Specimen Type Filter Header -->
        <div class="mt-8 flex flex-wrap justify-center gap-3 font-mono text-xs">
            <button onclick="filterCards('all')" id="filter-all" class="filter-btn px-4 py-2 rounded-xl bg-emerald-500 text-black font-bold transition-all duration-200 shadow-lg shadow-emerald-500/20 cursor-pointer">
                ⚡ ALL SPECIMENS
            </button>
            <button onclick="filterCards('image')" id="filter-image" class="filter-btn px-4 py-2 rounded-xl bg-emerald-950/80 border border-emerald-500/30 hover:border-emerald-400 text-emerald-300 font-semibold transition-all duration-200 cursor-pointer">
                🖼️ IMAGE
            </button>
            <button onclick="filterCards('audio')" id="filter-audio" class="filter-btn px-4 py-2 rounded-xl bg-emerald-950/80 border border-emerald-500/30 hover:border-emerald-400 text-emerald-300 font-semibold transition-all duration-200 cursor-pointer">
                🔊 AUDIO
            </button>
            <button onclick="filterCards('video')" id="filter-video" class="filter-btn px-4 py-2 rounded-xl bg-emerald-950/80 border border-emerald-500/30 hover:border-emerald-400 text-emerald-300 font-semibold transition-all duration-200 cursor-pointer">
                🎥 VIDEO
            </button>
            <button onclick="filterCards('text')" id="filter-text" class="filter-btn px-4 py-2 rounded-xl bg-emerald-950/80 border border-emerald-500/30 hover:border-emerald-400 text-emerald-300 font-semibold transition-all duration-200 cursor-pointer">
                📄 TEXT
            </button>
        </div>
    </header>

    <main id="cardsGrid" class="w-full max-w-6xl grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 justify-items-center pb-16">
        <!-- Dynamically injected cards will appear here -->
    </main>

    <script>
        let globalRecords = [];
        let currentFilter = 'all';

        const loadRecordData = () => {
            const populateData = (data) => {
                if (data.records && Array.isArray(data.records)) {
                    globalRecords = data.records;
                    renderCards(globalRecords);
                }
            };

            const fallbackData = {
                "records": [
                    {
                        "id": "EL-001",
                        "title": "Stray Capacitance Echo",
                        "type": "image",
                        "file": "https://placehold.co/400x300/064e3b/6ee7b7?text=Specimen+Alpha",
                        "date": "2026-03-12",
                        "place": "Sector 7 Substation",
                        "recorder": "Dr. V. Vance",
                        "not_captured": "A faint hum of residual electromagnetic consciousness lingering long after the power grid was completely powered down."
                    },
                    {
                        "id": "EL-002",
                        "title": "Resonant Audio Pulse",
                        "type": "audio",
                        "file": "",
                        "date": "2026-04-01",
                        "place": "Abandoned Transformer Vault",
                        "recorder": "Tech. K. Rix",
                        "not_captured": "Harmonic frequencies shifting upward beyond human hearing threshold whenever anyone approached the terminals."
                    },
                    {
                        "id": "EL-003",
                        "title": "Neon Surge Log-Alpha",
                        "type": "text",
                        "file": "",
                        "date": "2026-05-19",
                        "place": "Grid Node 09-Omega",
                        "recorder": "Unit 44-X",
                        "not_captured": "Unstable voltage spikes forming repeating geometric patterns in the discharge capacitors without external stimulus."
                    },
                    {
                        "id": "EL-004",
                        "title": "High Voltage Arc Footage",
                        "type": "video",
                        "file": "",
                        "date": "2026-06-22",
                        "place": "Sector 4 Grid Hub",
                        "recorder": "Agent Thorne",
                        "not_captured": "Brief visual flicker showing silhouette distortion within the plasma stream."
                    }
                ]
            };

            const targetUrl = (window.location.protocol.startsWith('blob') ? 'records.json' : './records.json') + '?t=' + new Date().getTime();
            fetch(targetUrl)
                .then(response => {
                    if (!response.ok) throw new Error('Network response was not ok');
                    return response.json();
                })
                .then(data => populateData(data))
                .catch(err => {
                    populateData(fallbackData);
                });
        };

        const renderCards = (records) => {
            const grid = document.getElementById('cardsGrid');
            grid.innerHTML = ''; 

            const filteredRecords = records.filter(record => {
                if (currentFilter === 'all') return true;
                if (currentFilter === 'audio') {
                    return record.type === 'sound' || record.type === 'audio';
                }
                if (currentFilter === 'video') {
                    return record.type === 'video' || record.type === 'mp4';
                }
                return record.type === currentFilter;
            });

            if (filteredRecords.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full py-16 text-center font-mono text-emerald-600/80">
                        <p class="text-base tracking-widest">NO SPECIMENS FOUND FOR SECTOR TYPE: [${currentFilter.toUpperCase()}]</p>
                    </div>
                `;
                return;
            }

            filteredRecords.forEach((record, index) => {
                const cardId = `cardInner-${index}`;
                const fieldsId = `specimenFields-${index}`;
                const mediaContainerId = `frontMediaContainer-${index}`;

                let mediaContentHtml = '';
                
                if (record.type === 'image') {
                    mediaContentHtml = `
                        <div id="${mediaContainerId}" class="w-full h-60 bg-emerald-950/20 rounded-2xl border border-emerald-500/20 flex flex-col items-center justify-center relative overflow-hidden backdrop-blur-sm p-2">
                            <div class="absolute -right-8 -top-8 w-24 h-24 bg-emerald-500/10 rounded-full blur-xl"></div>
                            <svg class="w-8 h-8 mb-2 stroke-1.5 text-emerald-400 placeholder-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                            </svg>
                            <span class="text-xs font-mono tracking-wider text-emerald-400/70 placeholder-text">Specimen Visual Data</span>
                        </div>
                    `;
                } else if (record.type === 'sound' || record.type === 'audio') {
                    mediaContentHtml = `
                        <div id="${mediaContainerId}" class="w-full h-60 bg-[#030906] rounded-2xl border border-emerald-500/30 flex flex-col items-center justify-between p-4 relative overflow-hidden shadow-inner group">
                            <!-- Background electric grid lines & glowing core -->
                            <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-emerald-950/40 via-[#030906] to-[#010402] pointer-events-none"></div>
                            <div class="absolute -top-10 -left-10 w-32 h-32 bg-emerald-500/10 rounded-full blur-2xl"></div>
                            
                            <!-- Top: Status & Frequency Header -->
                            <div class="w-full flex justify-between items-center z-10 font-mono text-[10px] text-emerald-500 tracking-wider">
                                <span class="flex items-center gap-1.5">
                                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-ping"></span>
                                    FREQ: 432 Hz
                                </span>
                                <span class="px-2 py-0.5 rounded bg-emerald-950 border border-emerald-500/40 text-emerald-300">LIVE OSC</span>
                            </div>

                            <!-- Center: Animated Electric Audio Waveform Bars -->
                            <div class="w-full flex items-center justify-center gap-1.5 z-10 my-auto h-16">
                                <div class="w-1.5 bg-emerald-500/40 rounded-full wave-bar"></div>
                                <div class="w-1.5 bg-emerald-400 rounded-full wave-bar"></div>
                                <div class="w-1.5 bg-emerald-300 rounded-full wave-bar"></div>
                                <div class="w-1.5 bg-emerald-500 rounded-full wave-bar"></div>
                                <div class="w-1.5 bg-emerald-400 rounded-full wave-bar"></div>
                                <div class="w-1.5 bg-emerald-300 rounded-full wave-bar"></div>
                                <div class="w-1.5 bg-emerald-500/40 rounded-full wave-bar"></div>
                            </div>

                            <!-- Bottom: High-voltage Custom Audio Controller -->
                            <div class="w-full z-10 bg-emerald-950/40 border border-emerald-500/30 rounded-xl p-2.5 backdrop-blur-md">
                                <audio controls class="w-full h-8 rounded accent-emerald-400 filter invert-[0.85] hue-rotate-[90deg]">
                                    <source src="${record.file || ''}" type="audio/mpeg">
                                    Your browser does not support audio playback.
                                </audio>
                            </div>
                        </div>
                    `;
                } else if (record.type === 'video' || record.type === 'mp4') {
                    mediaContentHtml = `
                        <div id="${mediaContainerId}" class="w-full h-60 bg-black rounded-2xl flex flex-col items-center justify-center relative overflow-hidden shadow-inner border border-emerald-500/20">
                            <video controls class="w-full h-full object-contain rounded-2xl">
                                <source src="${record.file || ''}" type="video/mp4">
                                Your browser does not support video playback.
                            </video>
                        </div>
                    `;
                } else if (record.type === 'text') {
                    mediaContentHtml = `
                        <div id="${mediaContainerId}" class="w-full h-60 bg-[#020503] border border-emerald-500/25 rounded-2xl p-4 flex flex-col relative overflow-hidden font-mono shadow-inner">
                            <div class="text-[11px] text-emerald-500 uppercase tracking-widest mb-2 font-bold flex items-center gap-2">
                                <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                                Transcript / Log Stream:
                            </div>
                            <div id="textContent-${index}" class="overflow-y-auto max-h-40 w-full pr-2 text-emerald-200 text-xs md:text-sm leading-relaxed whitespace-pre-wrap font-[Courier_New,Courier,monospace]">
                                Loading log stream...
                            </div>
                        </div>
                    `;
                } else {
                    mediaContentHtml = `
                        <div class="w-full h-60 bg-emerald-950/20 rounded-2xl border border-dashed border-emerald-500/30 flex flex-col items-center justify-center text-emerald-400/60 relative">
                            <span class="text-xs font-mono">General Circuit Record</span>
                        </div>
                    `;
                }

                const cardHtml = `
                    <div class="w-full max-w-[360px] md:max-w-[380px] h-[540px] perspective-1000">
                        <div id="${cardId}" class="relative w-full h-full duration-700 transform-style-3d rounded-3xl transition-transform">
                            
                            <!-- Front Face -->
                            <div class="absolute inset-0 w-full h-full bg-[#0a100d] text-emerald-100 rounded-3xl border border-emerald-500/30 p-6 flex flex-col justify-between box-border backface-hidden neon-glow neon-glow-hover transition-all duration-300">
                                
                                <!-- Top: Larger Media Container -->
                                <div class="w-full">
                                    ${mediaContentHtml}
                                </div>

                                <!-- Bottom: Title, Date & Location right above the Archive Button -->
                                <div class="flex flex-col gap-3">
                                    <div>
                                        <div class="flex items-center justify-between text-[11px] font-mono text-emerald-400 mb-1 tracking-wider">
                                            <span>📅 ${record.date || 'UNKNOWN DATE'}</span>
                                            <span class="text-emerald-500/70">⚡</span>
                                        </div>
                                        <h2 class="text-lg font-bold text-white tracking-tight mb-0.5 flex items-center justify-between font-mono">
                                            <span class="truncate">${record.title || 'Untitled'}</span>
                                        </h2>
                                        <p class="text-xs text-emerald-500/80 font-mono truncate">
                                            ${record.place || 'Unknown grid location'}
                                        </p>
                                    </div>

                                    <div>
                                        <button onclick="flipCard('${cardId}', '${fieldsId}', true)" class="w-full py-3 px-4 bg-emerald-500 hover:bg-emerald-400 text-black font-mono font-bold rounded-xl transition-all duration-200 shadow-lg shadow-emerald-500/20 focus:outline-none focus:ring-2 focus:ring-emerald-400 focus:ring-offset-2 tracking-wider text-xs uppercase cursor-pointer">
                                            Archive Core [🔋]
                                        </button>
                                    </div>
                                </div>
                            </div>

                            <!-- Back Face -->
                            <div class="absolute inset-0 w-full h-full bg-[#070c09] text-emerald-300 rounded-3xl border border-emerald-500/40 p-6 flex flex-col justify-between box-border backface-hidden rotate-y-180 font-mono shadow-xl">
                                
                                <div>
                                    <div class="flex justify-between items-center border-b border-emerald-500/20 pb-3 mb-3">
                                        <span class="text-[10px] uppercase tracking-widest text-emerald-500 font-bold">Specimen Log</span>
                                        <span class="text-[10px] font-semibold text-emerald-400">ID: ${record.id || record.catalog_id || '#000'}</span>
                                    </div>
                                </div>

                                <div id="${fieldsId}" class="flex flex-col justify-start gap-3 flex-grow py-1 text-xs overflow-y-auto pr-1">
                                    <div>
                                        <span class="text-emerald-600 block uppercase tracking-wider text-[10px] mb-0.5 font-bold">Designation</span>
                                        <span class="text-white font-medium decay-target inline-block">${record.title || ''}</span>
                                    </div>
                                    <div>
                                        <span class="text-emerald-600 block uppercase tracking-wider text-[10px] mb-0.5 font-bold">Timestamp & Sector</span>
                                        <span class="text-emerald-200 decay-target inline-block">${record.date || ''} / ${record.place || ''}</span>
                                    </div>
                                    <div>
                                        <span class="text-emerald-600 block uppercase tracking-wider text-[10px] mb-0.5 font-bold">Curator / Recorder</span>
                                        <span class="text-emerald-200 decay-target inline-block">${record.recorder || ''}</span>
                                    </div>
                                    <div>
                                        <span class="text-emerald-600 block uppercase tracking-wider text-[10px] mb-0.5 font-bold">Unmapped Anomaly (Decaying)</span>
                                        <span class="text-emerald-400/90 leading-relaxed block text-[11px] decay-target decay-delayed whitespace-pre-wrap">${record.not_captured || ''}</span>
                                    </div>
                                </div>

                                <div class="pt-2">
                                    <button onclick="flipCard('${cardId}', '${fieldsId}', false)" class="w-full py-2.5 px-4 bg-emerald-950 hover:bg-emerald-900 text-emerald-300 font-mono font-semibold rounded-xl transition-all duration-200 border border-emerald-500/30 text-xs uppercase tracking-wider focus:outline-none cursor-pointer">
                                        &larr; Reconnect Face
                                    </button>
                                </div>
                            </div>

                        </div>
                    </div>
                `;

                grid.insertAdjacentHTML('beforeend', cardHtml);

                if (record.type === 'image' && record.file) {
                    const container = document.getElementById(mediaContainerId);
                    if (container) {
                        container.innerHTML = `
                            <img src="${record.file}" alt="${record.title || 'Specimen'}" class="w-full h-full object-contain rounded-xl filter contrast-125 saturate-50">
                        `;
                    }
                }

                if (record.type === 'text' && record.file) {
                    const textContainer = document.getElementById(`textContent-${index}`);
                    if (textContainer) {
                        fetch(record.file)
                            .then(res => {
                                if (!res.ok) throw new Error('Failed to load text file');
                                return res.text();
                            })
                            .then(textData => {
                                textContainer.textContent = textData;
                            })
                            .catch(err => {
                                textContainer.textContent = record.not_captured || 'Could not load text stream.';
                            });
                    }
                }
            });
        };

        function filterCards(type) {
            currentFilter = type;
            
            // Update active state on buttons
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('bg-emerald-500', 'text-black', 'font-bold', 'shadow-lg', 'shadow-emerald-500/20');
                btn.classList.add('bg-emerald-950/80', 'text-emerald-300', 'border', 'border-emerald-500/30');
            });

            const activeBtn = document.getElementById(`filter-${type}`);
            if (activeBtn) {
                activeBtn.classList.remove('bg-emerald-950/80', 'text-emerald-300', 'border', 'border-emerald-500/30');
                activeBtn.classList.add('bg-emerald-500', 'text-black', 'font-bold', 'shadow-lg', 'shadow-emerald-500/20');
            }

            renderCards(globalRecords);
        }

        window.addEventListener('DOMContentLoaded', () => {
            loadRecordData();
        });

        function flipCard(cardId, fieldsId, showBack) {
            const cardInner = document.getElementById(cardId);
            const specimenFields = document.getElementById(fieldsId);
            
            if (showBack) {
                cardInner.classList.add('rotate-y-180');
                setTimeout(() => {
                    specimenFields.classList.add('decay-active');
                }, 100);
            } else {
                cardInner.classList.remove('rotate-y-180');
                specimenFields.classList.remove('decay-active');
            }
        }
    </script>
</body>
</html>
